name: Build and deploy to Bluehost

# Deploys the site to Bluehost over FTP whenever main is updated.
# Credentials live in the repo's encrypted Secrets (Settings -> Secrets and
# variables -> Actions): FTP_HOST, FTP_USERNAME, FTP_PASSWORD.
# You can also run it by hand from the Actions tab (workflow_dispatch).

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-bluehost
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (production base)
        run: npm run build -- --base=/

      - name: Deploy dist/ to Bluehost over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./dist/
          # The deploy FTP account is scoped to public_html/transformations123,
          # so that folder is its root — upload straight into it.
          server-dir: ./
          # Keeps a sync-state file on the server so later deploys only send
          # changed files. It will NOT wipe the folder.
          dangerous-clean-slate: false
